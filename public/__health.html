<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
  <title>Hot100 Runtime Health</title>
</head>
<body>HOT100_RUNTIME_STARTING
<script src="./runtime.js"></script>
<script>
(async () => {
  try {
    const [problems, tests, solutions] = await Promise.all([
      fetch('./data/problems.json').then(r => r.json()),
      fetch('./data/tests.json').then(r => r.json()),
      fetch('./data/solutions.json').then(r => r.json()),
    ]);
    if (!Array.isArray(problems) || problems.length !== 100 || !tests || !solutions) {
      throw new Error('DATA_HEALTH_FAILED');
    }

    const result = await Hot100Runtime.request('run', {
      language: 'python3',
      mode: 'acm',
      code: "print('HOT100_RUNTIME_OK')",
      input: ''
    });

    document.body.textContent =
      result && result.ok && String(result.stdout || '').trim() === 'HOT100_RUNTIME_OK'
        ? 'HOT100_RUNTIME_OK'
        : 'HOT100_RUNTIME_FAIL ' + JSON.stringify(result);
  } catch (error) {
    document.body.textContent = 'HOT100_RUNTIME_THROW ' +
      (error && error.stack || error && error.message || String(error));
  }
})();
</script>
</body>
</html>
